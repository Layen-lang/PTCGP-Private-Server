name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem cmd,internal -Recurse -File -Filter *.go |
            Where-Object { $_.FullName -notlike '*\internal\proto\*' -and $_.Name -notlike '*.gen.go' }
          $unformatted = @($files | ForEach-Object { gofmt -l $_.FullName })
          if ($unformatted) { throw "Unformatted Go files:`n$($unformatted -join "`n")" }

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Check publication safety
        shell: pwsh
        run: ./scripts/check_publication.ps1

name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to rebuild in place (must match VERSION)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG does not match VERSION $version" }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            gh release view $env:RELEASE_TAG --json tagName
            if ($LASTEXITCODE -ne 0) { throw "An in-place rebuild requires an existing release" }
          }

      - name: Test
        run: go test ./...

      - name: Build emulator readers and test the importer
        shell: pwsh
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          ./native/build.ps1
          cargo test --locked --manifest-path native/importer/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed" }

      - name: Build desktop application
        shell: pwsh
        run: |
          # The importer and both emulator readers are compiled into the app.
          cargo build --release --manifest-path desktop/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed" }

      - name: Build Windows executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage-build/bin | Out-Null
          go build -trimpath -ldflags "-s -w" -o stage-build/bin/ptcgp-server.exe ./cmd/ptcgp-server
          if ($LASTEXITCODE -ne 0) { throw "Server build failed" }
          Copy-Item desktop/target/release/ptcgp-private-server.exe stage-build/

      - name: Check publication safety
        shell: pwsh
        run: ./scripts/check_publication.ps1

      # Velopack builds the installer, the portable archive, the update
      # packages and the feed that installed applications read from this
      # repository's releases. Keep this version equal to the velopack crate
      # in desktop/Cargo.toml.
      - name: Install Velopack
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { throw "Velopack installation failed" }

      - name: Package release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/releases | Out-Null
          # The previous release makes a small delta package possible. The
          # first Velopack release has none.
          vpk download github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token $env:GH_TOKEN --outputDir dist/releases
          if ($LASTEXITCODE -ne 0) { Write-Warning "No previous release: publishing a full package only"; $global:LASTEXITCODE = 0 }
          ./desktop/package.ps1 -Build (Join-Path $PWD 'stage-build') -Output (Join-Path $PWD 'dist/releases')

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $repo = "https://github.com/$env:GITHUB_REPOSITORY"
          # A manual run rebuilds the assets of the existing release.
          $mode = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '--merge' } else { '--publish' }
          vpk upload github --repoUrl $repo --token $env:GH_TOKEN --outputDir dist/releases `
            --tag $env:RELEASE_TAG --releaseName "PTCGP Private Server $version" $mode
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
          if ($mode -eq '--publish') {
            $notes = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name=$env:RELEASE_TAG --jq .body
            if ($LASTEXITCODE -eq 0 -and $notes) { $notes | gh release edit $env:RELEASE_TAG --notes-file - }
          }

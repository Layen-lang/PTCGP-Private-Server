name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to rebuild in place (must match VERSION)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      PTCGP_UPDATE_PUBLIC_KEY: ${{ vars.PTCGP_UPDATE_PUBLIC_KEY }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG does not match VERSION $version" }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            gh release view $env:RELEASE_TAG --json tagName
            if ($LASTEXITCODE -ne 0) { throw "An in-place rebuild requires an existing release" }
          }

      - name: Install and build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test
        run: go test ./...

      - name: Build native importer and emulator readers
        shell: pwsh
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          ./native/build.ps1
          cargo test --locked --manifest-path native/importer/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed" }

      - name: Build Windows executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          if (!$env:PTCGP_UPDATE_PUBLIC_KEY) { throw "Configure release signing before publishing" }
          go build -trimpath -ldflags "-X github.com/Layen-lang/PTCGP-Private-Server/internal/updates.PublicKey=$env:PTCGP_UPDATE_PUBLIC_KEY" -o bin/ptcgp-launcher.exe ./cmd/ptcgp-launcher
          go build -trimpath -o bin/ptcgp-server.exe ./cmd/ptcgp-server

      - name: Check publication safety
        shell: pwsh
        run: ./scripts/check_publication.ps1

      - name: Package release
        shell: pwsh
        env:
          PTCGP_UPDATE_SIGNING_SEED: ${{ secrets.PTCGP_UPDATE_SIGNING_SEED }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $package = "PTCGP-Private-Server-$version-windows-amd64"
          $stage = Join-Path $PWD "dist/$package"
          New-Item -ItemType Directory -Force -Path "$stage/bin" | Out-Null
          Copy-Item bin/ptcgp-launcher.exe,bin/ptcgp-server.exe,bin/ptcgp-importer.exe,bin/ptcgp-reader-x86_64,bin/ptcgp-reader-aarch64 "$stage/bin"
          Copy-Item native/THIRD_PARTY_NOTICES.txt "$stage/bin"
          Copy-Item start-server.cmd,server.json,VERSION,README.md,CHANGELOG.md,LICENSE,NOTICE.md,SECURITY.md $stage
          Copy-Item docs "$stage/docs" -Recurse
          Copy-Item profiles "$stage/profiles" -Recurse
          go run ./cmd/ptcgp-release $stage dist/update "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Signed update preparation failed" }
          $archive = Join-Path $PWD "dist/$package.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -CompressionLevel NoCompression
          if ((Get-Item $archive).Length -ge 2GB) { throw "Release archive exceeds GitHub's 2 GiB per-file limit" }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -NoNewline -Encoding utf8 "dist/SHA256SUMS.txt"

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ('${{ github.event_name }}' -ne 'workflow_dispatch') {
            gh release create $env:RELEASE_TAG --title "PTCGP Private Server $version" --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          }
          gh release upload $env:RELEASE_TAG `
            "dist/PTCGP-Private-Server-$version-windows-amd64.zip" `
            "dist/SHA256SUMS.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Archive upload failed" }
          gh release upload $env:RELEASE_TAG (Get-ChildItem dist/update -File | Where-Object Name -ne 'update.json').FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Update upload failed" }
          # Publish the signed manifest only after every referenced file is ready.
          gh release upload $env:RELEASE_TAG dist/update/update.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "Manifest upload failed" }
          gh release edit $env:RELEASE_TAG --draft=false

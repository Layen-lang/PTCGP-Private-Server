[package]
name = "ptcgp-importer"
version = "0.0.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"
texture2ddecoder = "0.1.2"
lz4_flex = "0.11"

[profile.release]
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"

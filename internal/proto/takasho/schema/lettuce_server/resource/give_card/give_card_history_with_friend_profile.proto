syntax = "proto3";

package takasho.schema.lettuce_server.resource.give_card;

import "google/protobuf/timestamp.proto";
import "takasho/schema/lettuce_server/resource/card/card_instance.proto";

message GiveCardHistoryWithFriendProfile {
  takasho.schema.lettuce_server.resource.card.CardInstance given_card = 100;
  string receiver_player_id = 200;
  google.protobuf.Timestamp given_at = 300;
  int64 given_card_remaining_amount = 400;
  string nickname = 500;
  string icon_id = 600;
}

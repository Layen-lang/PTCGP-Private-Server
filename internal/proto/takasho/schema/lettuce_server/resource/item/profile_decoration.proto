syntax = "proto3";

package takasho.schema.lettuce_server.resource.item;

import "google/protobuf/timestamp.proto";

message ProfileDecoration {
  message Types {
    enum Type {
      TYPE_UNSPECIFIED = 0;
      TYPE_EMBLEM = 1;
      TYPE_ICON = 2;
    }
  }
  ProfileDecoration.Types.Type type = 1;
  string id = 2;
  uint64 amount = 3;
  google.protobuf.Timestamp obtained_at = 4;
}

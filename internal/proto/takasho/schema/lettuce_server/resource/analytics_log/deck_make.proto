syntax = "proto3";

package takasho.schema.lettuce_server.resource.analytics_log;

message DeckMake {
  message Types {
    enum EnergyType {
      ENERGY_TYPE_UNSPECIFIED = 0;
      ENERGY_TYPE_COLORLESS = 1;
      ENERGY_TYPE_GRASS = 2;
      ENERGY_TYPE_FIRE = 3;
      ENERGY_TYPE_WATER = 4;
      ENERGY_TYPE_LIGHTNING = 5;
      ENERGY_TYPE_PSYCHIC = 6;
      ENERGY_TYPE_FIGHTING = 7;
      ENERGY_TYPE_DARKNESS = 8;
      ENERGY_TYPE_METAL = 9;
      ENERGY_TYPE_DRAGON = 10;
    }
  }
  string deck_id = 1;
  repeated string deck_card_ids = 2;
  repeated DeckMake.Types.EnergyType energy_types = 3;
  string playmat_id = 4;
  string deckshield_id = 5;
  string coin_id = 6;
  int64 deck_make_type = 7;
  int64 auto_deck_make_flg = 8;
}

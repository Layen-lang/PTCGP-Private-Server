syntax = "proto3";

package takasho.schema.lettuce_server.player_api;

message DeckChangeOrderV1 {
  message Types {
    message Request {
      message Types {
        message Order {
          uint64 deck_id = 1;
          int64 order = 2;
        }
      }
      repeated DeckChangeOrderV1.Types.Request.Types.Order orders = 1;
    }
    message Response {
    }
  }
}

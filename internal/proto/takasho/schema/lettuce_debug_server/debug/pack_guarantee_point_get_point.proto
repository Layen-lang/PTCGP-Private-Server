syntax = "proto3";

package takasho.schema.lettuce_debug_server.debug;

message PackGuaranteePointGetPoint {
  message Types {
    message Request {
      string player_id = 1;
      string pack_guarantee_point_id = 2;
    }
    message Response {
      string pack_guarantee_point_id = 1;
      int64 amount = 2;
    }
  }
}

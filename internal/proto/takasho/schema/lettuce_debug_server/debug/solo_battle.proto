syntax = "proto3";

package takasho.schema.lettuce_debug_server.debug;

import "takasho/schema/lettuce_debug_server/debug/solo_battle_add_event_power.proto";
import "takasho/schema/lettuce_debug_server/debug/solo_battle_set_win_streak.proto";

service SoloBattle {
  rpc AddEventPower (SoloBattleAddEventPower.Types.Request) returns (SoloBattleAddEventPower.Types.Response);
  rpc SetWinStreak (SoloBattleSetWinStreak.Types.Request) returns (SoloBattleSetWinStreak.Types.Response);
}
